name: Release standalone package

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag matching package.json (for example v0.1.0)
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npm test
      - run: npm run test:install
      - name: Validate release version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: node -e 'const p=require("./package.json"); if(process.env.RELEASE_TAG!=="v"+p.version) throw new Error("Release tag must match package.json");'
      - run: node -e "require('node:fs').mkdirSync('artifacts',{recursive:true})"
      - run: npm pack --pack-destination artifacts
      - name: Publish the tested tarball
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: gh release create "$RELEASE_TAG" artifacts/*.tgz --target "$GITHUB_SHA" --title "KAP+ $RELEASE_TAG" --generate-notes
